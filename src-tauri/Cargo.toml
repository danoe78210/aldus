[package]
name = "aldus"
version = "1.4.6"
description = "Aldus — Atelier du Livre Moderne (composition & reliure humaniste, export KDP Word / PDF / EPUB)"
authors = ["Danoë"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Nom du crate consommé par `main.rs`.
name = "aldus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "=2.3.6"
tauri-plugin-log = "2"
tokio = { version = "1", features = ["sync", "time"] }
chrono = "0.4.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
log = "0.4"
# Scan récursif de « Mes sources » (déjà présent transitivement dans l'arbre).
walkdir = "2.5"
# Requêtes HTTP concurrentes du module « Correcteur » (`join_all`).
futures = "0.3"
# Client HTTP du module « Correcteur » (appel LanguageTool /v2/check).
reqwest = { version = "0.12", features = ["json"] }
# Moteur de génération du manuscrit .docx.
docx-rs = "0.4"
# Post-traitement du .docx (behind text, mirror margins) — même crate que docx-rs.
zip = "8.6"
epub-builder = "0.8.3"
lopdf = { version = "0.36", default-features = false }
roxmltree = "0.20"
# Moteur PDF embarqué : compilation d'une source Typst (générée depuis l'AST)
# vers un PDF prêt-à-imprimer KDP. `typst` = mise en page, `typst-pdf` = export.
typst = "0.12"
typst-pdf = "0.12"
# Polices embarquées (Libertinus & CTAN) : le compilateur ne dépend d'aucune
# police système pour produire un PDF.
typst-assets = { version = "0.12", features = ["fonts"] }
# Traitement des images (conversion Noir & Blanc optimisée pour l'impression).
# Déjà présent via docx-rs ; déclaré en direct pour piloter les formats supportés.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "tiff",
    "webp",
] }

# Optimisations de taille pour le binaire empaqueté.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
