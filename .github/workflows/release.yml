name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev patchelf build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aldus ${{ github.ref_name }}'
          releaseBody: |
            ## Aldus 1.4.0 — Bibliothèque & Studio Audio

            - Banc IV — Bibliothèque : rayons, scan et Registre multi-formats.
            - Banc V — Studio Audio : XTTS v2 local, génération par chapitre, progression globale et lecteur intégré.
            - Découpage XTTS en segments de 240 caractères et assemblage MP3 par chapitre.
            - Erreurs contextualisées dans le journal Tauri et le terminal du wrapper local.

            ### Captures
            - [Registre & sélecteur de chapitre](https://github.com/danoe78210/aldus/blob/v1.4.0/docs/assets/screenshots/studio-audio-chapter-selector.png)
            - [Pupitre Audio & badge AUDIO](https://github.com/danoe78210/aldus/blob/v1.4.0/docs/assets/screenshots/studio-audio-player.png)
            - [Progression supérieure](https://github.com/danoe78210/aldus/blob/v1.4.0/docs/assets/screenshots/studio-audio-progress.png)

            Voir [CHANGELOG.md](https://github.com/danoe78210/aldus/blob/v1.4.0/CHANGELOG.md) et le [Manuel du Scribe Audio](https://github.com/danoe78210/aldus/blob/v1.4.0/docs/manuel-scribe-audio.md).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}