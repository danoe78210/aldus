name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: '--config src-tauri/tauri.sidecar.conf.json --bundles msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev patchelf build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Python for the bundled audio engine
        if: matrix.platform == 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'

      - name: Build XTTS and FFmpeg sidecars
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/build_windows_audio_sidecars.ps1

      - name: Test XTTS voice initialization
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: python -m unittest discover -s scripts -p "test_xtts_wrapper.py" -v

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aldus ${{ github.ref_name }}'
          releaseBody: |
            ## Aldus 1.4.11 — Lecteur d'Atelier & ruban Studio Audio

            - Lecteur d'Atelier : « Ouvrir le livre » lit l'EPUB, le PDF ou le DOCX en plein écran, avec trois papiers (Vélin, Parchemin, Dark Atelier), tiroir typographique, table des matières, mode Silence et signets dorés conservés dans `.aldus/bookmarks.json`.
            - Ruban « Studio Audio » dédié : console du moteur XTTS v2 local, choix de la voix et table de synthèse par chapitre (génération, régénération, écoute, suppression des pistes MP3).
            - Installateur MSI en français (`fr-FR`), aux couleurs d'Aldus : emblème doré, bandeau en vélin et texte lisible quel que soit le thème de Windows.
            - Aucun changement du moteur vocal : sidecar local sur `127.0.0.1:8020`, segments de 240 caractères maximum, consentement CPML inchangé.

            ### Captures
            - [Lecteur d'Atelier](https://github.com/danoe78210/aldus/blob/v1.4.11/docs/assets/screenshots/lecteur-atelier-v1.4.11.png)
            - [Studio Audio](https://github.com/danoe78210/aldus/blob/v1.4.11/docs/assets/screenshots/studio-audio-v1.4.11.png)

            Voir [CHANGELOG.md](https://github.com/danoe78210/aldus/blob/v1.4.11/CHANGELOG.md).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}