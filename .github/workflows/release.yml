name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: '--config src-tauri/tauri.sidecar.conf.json --bundles msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev patchelf build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Python for the bundled audio engine
        if: matrix.platform == 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'

      - name: Build XTTS and FFmpeg sidecars
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/build_windows_audio_sidecars.ps1

      - name: Test XTTS voice initialization
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: python -m unittest discover -s scripts -p "test_xtts_wrapper.py" -v

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aldus ${{ github.ref_name }}'
          releaseBody: |
            ## Aldus 1.4.12 — Le Salon de lecture et l'Oratoire parachevés

            - Oratoire : transcription du manuscrit en script de podcast (Narrateur / Dialogues, incises élaguées, respirations, table phonétique), synthèse locale sur `127.0.0.1:8020`, assemblage FFmpeg, Discothèque et console à bande aux vu-mètres réactifs.
            - Salon de lecture : double page permanente, tournage de page 3D, curseur « Chapitre X · Page Y », césures françaises, lettrines, papiers Atelier Sombre et Vélin Naturel.
            - Les PDF se lisent dans le Salon, texte recomposé.
            - Dépendances mises à jour : `npm audit` sans vulnérabilité.

            ### Captures
            - [Oratoire — transcription](https://github.com/danoe78210/aldus/blob/v1.4.12/docs/assets/01-oratoire-studio-transcription.png)
            - [Salon de lecture — Atelier Sombre](https://github.com/danoe78210/aldus/blob/v1.4.12/docs/assets/03-salon-lecture-double-page-sombre.png)

            Voir [CHANGELOG.md](https://github.com/danoe78210/aldus/blob/v1.4.12/CHANGELOG.md).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}