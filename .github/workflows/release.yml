name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: '--config src-tauri/tauri.sidecar.conf.json --bundles msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev patchelf build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Python for the bundled audio engine
        if: matrix.platform == 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'

      - name: Build XTTS and FFmpeg sidecars
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/build_windows_audio_sidecars.ps1

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aldus ${{ github.ref_name }}'
          releaseBody: |
            ## Aldus 1.4.5 — modale de mise à jour & aura bronze

            - Modale de mise à jour fermable par bouton, Échap et clic hors panneau; téléchargement via le navigateur système.
            - Plaque de bronze : aura dorée pulsante lorsque la vérification quotidienne détecte une release plus récente.
            - Banc X : validation et écriture atomique des corrections du chapitre; confirmation avant abandon des changements non enregistrés.
            - Banc V — Studio Audio unitaire, métriques dynamiques et suppression de piste MP3; assistant CPML immédiat et progression XTTS au pupitre supérieur.
            - Windows : MSI WiX autonome avec sidecar PyInstaller, `gruut/VERSION` contrôlé et FFmpeg embarqué.

            ### Captures
            - [Registre & sélecteur de chapitre](https://github.com/danoe78210/aldus/blob/v1.4.5/docs/assets/screenshots/studio-audio-chapter-selector.png)
            - [Pupitre Audio & badge AUDIO](https://github.com/danoe78210/aldus/blob/v1.4.5/docs/assets/screenshots/studio-audio-player.png)
            - [Progression supérieure](https://github.com/danoe78210/aldus/blob/v1.4.5/docs/assets/screenshots/studio-audio-progress.png)

            Voir [CHANGELOG.md](https://github.com/danoe78210/aldus/blob/v1.4.5/CHANGELOG.md) et le [Manuel du Scribe Audio](https://github.com/danoe78210/aldus/blob/v1.4.5/docs/manuel-scribe-audio.md).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}