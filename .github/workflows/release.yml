name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: '--config src-tauri/tauri.sidecar.conf.json --bundles msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev patchelf build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Python for the bundled audio engine
        if: matrix.platform == 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'

      - name: Build XTTS and FFmpeg sidecars
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/build_windows_audio_sidecars.ps1

      - name: Test XTTS voice initialization
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: python -m unittest discover -s scripts -p "test_xtts_wrapper.py" -v

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aldus ${{ github.ref_name }}'
          releaseBody: |
            ## Aldus 1.4.9 — Épreuve de Plume & Usage Aldin

            - Épreuve de Plume : audit stylométrique local et déterministe, score heuristique de risque, détection contextualisée, suggestions de remaniement et règles d'auteur personnalisées.
            - Règles natives consolidées : cadence et paragraphes, tics de liaison, triades, listes Markdown préformatées, diversité lexicale et indices de texture humaine. Le score reste indicatif ; aucun test de watermarking non fondé n'est annoncé.
            - Usage Aldin : aperçu puis normalisation en une passe des fichiers Markdown du workspace, avec confirmation, rapport, sauvegarde par chapitre et écriture atomique.
            - Dark Atelier : tokens de couleur centralisés, cartes et classes typographiques partagées, contraste renforcé dans les panneaux ciblés.

            - Les ligatures ne sont appliquées qu'à des mots français reconnus ; le traitement exclut les dossiers cachés et `.aldus`.
            - Les instantanés avant normalisation sont visibles et restaurables dans l'historique du chapitre.
            - Les anciennes données d'application dans APPDATA sont migrées vers LocalAppData ; les conflits sont archivés localement sans remplacer silencieusement les données actives.

            ### Captures
            - [Gestionnaire de règles de l'Épreuve de Plume](https://github.com/danoe78210/aldus/blob/v1.4.9/docs/assets/screenshots/epreuve-de-plume-v1.4.9.png)

            Voir [CHANGELOG.md](https://github.com/danoe78210/aldus/blob/v1.4.9/CHANGELOG.md).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}