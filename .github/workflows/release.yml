name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: '--config src-tauri/tauri.sidecar.conf.json --bundles msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev patchelf build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Python for the bundled audio engine
        if: matrix.platform == 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'

      - name: Build XTTS and FFmpeg sidecars
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/build_windows_audio_sidecars.ps1

      - name: Test XTTS voice initialization
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: python -m unittest discover -s scripts -p "test_xtts_wrapper.py" -v

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aldus ${{ github.ref_name }}'
          releaseBody: |
            ## Aldus 1.4.10 — Épreuve de Plume, pupitre de remaniement

            - Épreuve de Plume recentrée sur la stylométrie : cadence, tics de transition, triades, entropie et distribution de Zipf ; aucune règle d'orthotypographie du Banc d'Épreuve.
            - Registre des Remaniements : cartes d'alerte défilantes avec texte original, diagnostic et proposition de la Forge.
            - « Appliquer la reformation » : instantané `.aldus/history/`, écriture atomique vérifiée et recalcul immédiat du score ; « Ignorer » masque l'alerte pour la session.
            - Manuscrit annoté : surlignage bidirectionnel carte ↔ passage, texte justifié avec césures françaises (Literata), titres Markdown mis en forme.
            - Contrastes Dark Atelier renforcés sur la jauge, les cartes et les boutons.
            - Plaque de version : cache de vérification de deux heures et bouton « Vérifier maintenant ».

            Le score reste un indicateur heuristique, non une preuve d'origine.

            ### Captures
            - [Épreuve de Plume — Registre des Remaniements](https://github.com/danoe78210/aldus/blob/v1.4.10/docs/assets/screenshots/epreuve-de-plume-v1.4.10.png)

            Voir [CHANGELOG.md](https://github.com/danoe78210/aldus/blob/v1.4.10/CHANGELOG.md).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}